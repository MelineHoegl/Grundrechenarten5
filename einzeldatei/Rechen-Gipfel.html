<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Rechen-Gipfel</title>
<meta name="description" content="Digitale Lernwelt Grundrechenarten für die 5. Klasse der Mittelschule in Bayern: halbschriftlich und schriftlich addieren, subtrahieren, multiplizieren und dividieren.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&family=Baloo+2:wght@600;700;800&display=swap">
<style>
/* Rechen-Gipfel
   Layout: eine Spalte auf Karopapier; beim Üben links die Aufgabe, rechts Gamsi, Zahlenfeld und Knöpfe.
   Farben der vier Berge wie auf den Merkplakaten: Plus grün, Minus blau, Mal pink, Geteilt orange. */
:root {
  --paper: #fbfcfe;
  --grid: #e3eaf3;
  --card: #ffffff;
  --fg: #1c2433;
  --muted: #5a6476;
  --line: #c7d1de;
  --ink: #1d4fa8;            /* Füller-Blau für eigene Eingaben */
  --red: #c42a40;            /* Korrekturrot */
  --red-soft: #fde4e8;
  --ok: #24794f;
  --ok-soft: #dcf2e5;
  --sun: #f2ad00;
  --sun-soft: #fff2c7;
  --snow: #ffffff;
  --add: #5e9a1c;  --add-soft: #e9f4d6;
  --sub: #1a86c2;  --sub-soft: #d9eefa;
  --mul: #cf3f84;  --mul-soft: #fbdeec;
  --div: #dd6b12;  --div-soft: #fde5d0;
  --accent: var(--add);
  --accent-soft: var(--add-soft);
  --shadow: 0 2px 0 rgba(28, 36, 51, .08), 0 8px 24px rgba(28, 36, 51, .06);
  --font-display: 'Baloo 2', 'Andika', 'Trebuchet MS', system-ui, sans-serif;
  --font-body: 'Andika', 'Segoe UI', system-ui, sans-serif;
  --cell: clamp(36px, 9vw, 54px);
  --radius: 18px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #131a27; --grid: #1c2638; --card: #1a2333; --fg: #e9edf4; --muted: #a4aec0; --line: #34425a;
    --ink: #8fb4ff; --red: #ff7d8f; --red-soft: #43202a; --ok: #59d08f; --ok-soft: #173a29; --sun: #ffc93d; --sun-soft: #3f3313; --snow: #dce5f2;
    --add: #8ccf45; --add-soft: #253517; --sub: #4fb6ee; --sub-soft: #15304a; --mul: #f070ad; --mul-soft: #3d1a2c; --div: #ff9a4d; --div-soft: #3f2614;
    --shadow: 0 2px 0 rgba(0, 0, 0, .3), 0 8px 24px rgba(0, 0, 0, .25);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #131a27; --grid: #1c2638; --card: #1a2333; --fg: #e9edf4; --muted: #a4aec0; --line: #34425a;
  --ink: #8fb4ff; --red: #ff7d8f; --red-soft: #43202a; --ok: #59d08f; --ok-soft: #173a29; --sun: #ffc93d; --sun-soft: #3f3313; --snow: #dce5f2;
  --add: #8ccf45; --add-soft: #253517; --sub: #4fb6ee; --sub-soft: #15304a; --mul: #f070ad; --mul-soft: #3d1a2c; --div: #ff9a4d; --div-soft: #3f2614;
  --shadow: 0 2px 0 rgba(0, 0, 0, .3), 0 8px 24px rgba(0, 0, 0, .25);
  color-scheme: dark;
}
[data-op="add"] { --accent: var(--add); --accent-soft: var(--add-soft); }
[data-op="sub"] { --accent: var(--sub); --accent-soft: var(--sub-soft); }
[data-op="mul"] { --accent: var(--mul); --accent-soft: var(--mul-soft); }
[data-op="div"] { --accent: var(--div); --accent-soft: var(--div-soft); }

* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  font-family: var(--font-body);
  font-size: 17px;
  line-height: 1.5;
  color: var(--fg);
  background-color: var(--paper);
  background-image:
    linear-gradient(var(--grid) 1px, transparent 1px),
    linear-gradient(90deg, var(--grid) 1px, transparent 1px);
  background-size: 26px 26px;
  min-height: 100vh;
}
[hidden] { display: none !important; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--sun); outline-offset: 2px; }

.app {
  max-width: 1080px;
  margin: 0 auto;
  padding-block: 24px 48px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.screen { display: flex; flex-direction: column; gap: 20px; animation: rise .35s ease both; }
@keyframes rise { from { transform: translateY(8px); opacity: .4; } to { transform: none; opacity: 1; } }

h1, h2, h3 { font-family: var(--font-display); line-height: 1.1; margin: 0; text-wrap: balance; }
h1 { font-size: clamp(44px, 8vw, 76px); font-weight: 800; letter-spacing: -.01em; }
.eyebrow { margin: 0; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .08em; font-size: 13px; }
.lead { margin: 0; font-size: 18px; color: var(--muted); max-width: 58ch; }
.pick-title { font-size: 26px; font-weight: 700; }

/* ---------- Start ---------- */
.hero { display: flex; gap: 24px; align-items: center; justify-content: space-between; flex-wrap: wrap; }
.hero-text { display: flex; flex-direction: column; gap: 8px; min-width: 0; flex: 1 1 380px; }
.hero-side { display: flex; flex-direction: column; align-items: center; gap: 8px; }
.score-pill { font-family: var(--font-display); font-weight: 700; font-size: 18px; background: var(--sun-soft); color: var(--fg); border: 2px solid var(--sun); border-radius: 999px; padding: 2px 16px; font-variant-numeric: tabular-nums; }

.op-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 16px; }
@media (max-width: 860px) { .op-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (max-width: 420px) { .op-grid { grid-template-columns: minmax(0, 1fr); } }
.op-card {
  display: flex; flex-direction: column; gap: 6px; text-align: left;
  background: var(--card); border: 3px solid var(--accent); border-radius: var(--radius);
  padding: 0 0 16px; cursor: pointer; overflow: hidden; box-shadow: var(--shadow);
  transition: transform .15s ease;
}
.op-card:hover { transform: translateY(-3px); }
.op-card svg { display: block; width: 100%; height: auto; max-height: 130px; background: var(--accent-soft); }
@media (max-width: 420px) { .op-card svg { height: 110px; } }
.op-card .op-name { font-family: var(--font-display); font-weight: 800; font-size: 26px; padding: 4px 16px 0; color: var(--fg); }
.op-card .op-sub { padding: 0 16px; color: var(--muted); font-size: 15px; }
.op-card .op-progress { padding: 4px 16px 0; font-size: 14px; font-weight: 700; color: var(--accent); }

.home-foot { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; padding-top: 8px; }
.link-btn { background: none; border: 0; padding: 4px 0; color: var(--muted); text-decoration: underline; cursor: pointer; font-size: 15px; }
.reset-confirm { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; font-size: 15px; }

/* ---------- Auswahl Verfahren / Stufe ---------- */
.crumbs { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; color: var(--muted); font-weight: 700; }
.back-btn { background: var(--card); border: 2px solid var(--line); border-radius: 999px; padding: 6px 14px; cursor: pointer; font-weight: 700; }
.back-btn:hover { border-color: var(--accent); }
.choice-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 18px; }
@media (max-width: 680px) { .choice-grid { grid-template-columns: minmax(0, 1fr); } }
.choice {
  display: flex; flex-direction: column; gap: 10px; text-align: left; cursor: pointer;
  background: var(--card); border: 3px solid var(--accent); border-radius: var(--radius);
  padding: 20px; box-shadow: var(--shadow); min-width: 0; transition: transform .15s ease;
}
.choice:hover { transform: translateY(-3px); }
.choice h3 { font-size: 30px; font-weight: 800; }
.choice p { margin: 0; color: var(--muted); }
.choice .example { background: var(--accent-soft); border-radius: 12px; padding: 10px 14px; font-size: 18px; font-variant-numeric: tabular-nums; overflow-x: auto; }
.choice .example pre { margin: 0; font-family: var(--font-body); font-size: 18px; line-height: 1.3; }
.trail { display: flex; gap: 6px; align-items: flex-end; flex-wrap: wrap; }
.hut { display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: 12px; font-weight: 700; color: var(--muted); }
.hut svg { width: 40px; height: 34px; }
.trail-note { font-size: 14px; font-weight: 700; color: var(--accent); }

/* ---------- Üben ---------- */
.play-bar { display: flex; gap: 12px; align-items: center; justify-content: space-between; flex-wrap: wrap; }
.play-info { display: flex; gap: 8px; flex-wrap: wrap; }
.badge { display: inline-block; background: var(--accent); color: var(--card); font-weight: 700; border-radius: 999px; padding: 3px 14px; font-size: 15px; }
.badge.soft { background: var(--accent-soft); color: var(--fg); }
.play-score { font-family: var(--font-display); font-weight: 700; font-size: 20px; font-variant-numeric: tabular-nums; }
.dots { display: flex; gap: 8px; }
.dot { width: 34px; height: 10px; border-radius: 6px; background: var(--line); }
.dot.now { background: var(--sun); }
.dot.ok { background: var(--ok); }
.dot.meh { background: var(--accent); opacity: .55; }
.dot.bonus { outline: 2px dashed var(--sun); outline-offset: 2px; }

.play-main { display: grid; grid-template-columns: minmax(0, 1fr) 320px; gap: 20px; align-items: start; }
@media (max-width: 860px) { .play-main { grid-template-columns: minmax(0, 1fr); } }
.task-card { background: var(--card); border: 3px solid var(--accent); border-radius: var(--radius); padding: 20px; display: flex; flex-direction: column; gap: 16px; box-shadow: var(--shadow); min-width: 0; }
.task-kicker { margin: 0; font-weight: 700; color: var(--accent); text-transform: uppercase; letter-spacing: .06em; font-size: 13px; }
.task-title { font-size: clamp(28px, 5vw, 40px); font-weight: 800; font-variant-numeric: tabular-nums; }
.work { overflow-x: auto; padding: 4px 2px 8px; }

.sach { background: var(--accent-soft); border-radius: 14px; padding: 14px 16px; display: flex; flex-direction: column; gap: 12px; }
.sach p { margin: 0; font-size: 18px; max-width: 62ch; }
.sach .q { font-weight: 700; }
.opt-row { display: flex; gap: 10px; flex-wrap: wrap; }
.opt { background: var(--card); border: 2px solid var(--line); border-radius: 12px; padding: 8px 16px; font-size: 20px; font-weight: 700; cursor: pointer; font-variant-numeric: tabular-nums; }
.opt:hover { border-color: var(--accent); }
.opt.wrong { border-color: var(--red); background: var(--red-soft); animation: shake .3s; }
.opt.right { border-color: var(--ok); background: var(--ok-soft); }
@keyframes shake { 25% { transform: translateX(-4px); } 75% { transform: translateX(4px); } }
.answer-box { background: var(--ok-soft); border: 2px solid var(--ok); border-radius: 14px; padding: 12px 16px; font-size: 18px; }
.answer-box b { font-family: var(--font-display); }

/* Rechenkästchen */
.grid { display: grid; grid-template-columns: repeat(var(--cols), var(--cell)); width: max-content; }
.cell {
  width: var(--cell); height: var(--cell);
  display: flex; align-items: center; justify-content: center;
  border-right: 1px solid var(--line); border-bottom: 1px solid var(--line);
  font-size: calc(var(--cell) * .58); font-weight: 700; line-height: 1;
  background: transparent; padding: 0; font-variant-numeric: tabular-nums;
}
.cell.first { border-left: 1px solid var(--line); }
.cell.top { border-top: 1px solid var(--line); }
.cell.rule { border-top: 4px solid var(--fg); }
.cell.sign { color: var(--fg); }
.cell.small { font-size: calc(var(--cell) * .36); color: var(--muted); }
.cell.in { background: var(--card); color: var(--ink); cursor: pointer; border-radius: 0; border-left: 0; border-top-style: solid; }
.cell.in:hover { background: var(--sun-soft); }
.cell.sel { box-shadow: inset 0 0 0 3px var(--sun); background: var(--sun-soft); }
.cell.ok { background: var(--ok-soft); }
.cell.bad { background: var(--red-soft); }
.cell.shown { color: var(--red); }
.cell.mark { color: var(--ink); }
.cell.hl { background: var(--sun-soft); }
.cell.ul { border-bottom: 3px solid var(--fg); }
.cell.down { color: var(--accent); }
.grid-legend { font-size: 14px; color: var(--muted); margin: 8px 0 0; }

/* Rechnen in Schritten */
.steps { display: flex; flex-direction: column; gap: 10px; }
.hs-row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; font-size: clamp(22px, 4vw, 28px); font-weight: 700; font-variant-numeric: tabular-nums; }
.hs-row.final { border-top: 3px solid var(--fg); padding-top: 10px; margin-top: 4px; }
.slot {
  min-width: calc(var(--w) * 0.75em + 0.8em); height: 1.7em; padding: 0 .3em;
  border: 2px dashed var(--line); border-radius: 10px; background: var(--card); color: var(--ink);
  font-weight: 700; font-size: inherit; cursor: pointer; text-align: right; font-variant-numeric: tabular-nums;
}
.slot.given { border-style: solid; border-color: transparent; background: var(--accent-soft); color: var(--fg); cursor: default; }
.slot.sel { border-style: solid; border-color: var(--sun); background: var(--sun-soft); }
.slot.ok { border-style: solid; border-color: var(--ok); background: var(--ok-soft); }
.slot.bad { border-style: solid; border-color: var(--red); background: var(--red-soft); }
.slot.shown { color: var(--red); }
.ref { color: var(--muted); min-width: 1.5em; text-align: right; }

/* Division Schritt für Schritt */
.div-prompt { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; background: var(--sun-soft); border-radius: 14px; padding: 10px 14px; font-size: 20px; font-weight: 700; }
.div-prompt .slot { min-width: 3.2em; }
.div-done { background: var(--ok-soft); }

/* Seitenleiste */
.side { display: flex; flex-direction: column; gap: 14px; }
.coach { display: flex; gap: 10px; align-items: flex-start; }
.bubble {
  position: relative; flex: 1; min-width: 0; background: var(--card); border: 2px solid var(--line);
  border-radius: 16px; padding: 10px 14px; font-size: 16px; min-height: 64px;
}
.bubble.good { border-color: var(--ok); background: var(--ok-soft); }
.bubble.oops { border-color: var(--red); background: var(--red-soft); }
.bubble.tip { border-color: var(--sun); background: var(--sun-soft); }
.bubble ol { margin: 6px 0 0; padding-left: 20px; }
.bubble li { margin: 2px 0; font-size: 15px; }

.pad { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
.key {
  height: 56px; border-radius: 14px; border: 2px solid var(--line); background: var(--card);
  font-family: var(--font-display); font-size: 26px; font-weight: 700; cursor: pointer; touch-action: manipulation;
}
.key:hover { border-color: var(--accent); }
.key:active { transform: translateY(1px); background: var(--accent-soft); }
.key.wide { grid-column: span 2; }
.key.fn { font-size: 18px; color: var(--muted); }
.actions { display: grid; grid-template-columns: 1fr 2fr; gap: 10px; }
.btn {
  border-radius: 14px; border: 2px solid transparent; padding: 12px 18px; cursor: pointer;
  font-family: var(--font-display); font-weight: 700; font-size: 20px;
}
.btn.primary { background: var(--accent); color: var(--card); }
.btn.primary:hover { filter: brightness(1.05); }
.btn.ghost { background: var(--card); border-color: var(--line); }
.btn.ghost:hover { border-color: var(--accent); }
.btn.small { font-size: 15px; padding: 6px 12px; border-radius: 10px; }
.btn.danger { background: var(--red); color: var(--card); }
.btn:disabled { opacity: .45; cursor: not-allowed; }

/* Maskottchen */
.mascot { width: 120px; height: 120px; }
.mascot.small { width: 64px; height: 64px; flex-shrink: 0; }
.mascot.big { width: 150px; height: 150px; }
.mascot svg { width: 100%; height: 100%; }
.mascot.hop svg { animation: hop .5s ease; }
@keyframes hop { 40% { transform: translateY(-10px) rotate(-4deg); } }

/* Rundenende */
.done-card { background: var(--card); border: 3px solid var(--accent); border-radius: var(--radius); padding: 28px 20px; display: flex; flex-direction: column; align-items: center; gap: 14px; text-align: center; box-shadow: var(--shadow); }
.done-card h2 { font-size: clamp(30px, 6vw, 46px); font-weight: 800; }
.done-stars { display: flex; gap: 8px; }
.done-stars svg { width: 56px; height: 56px; }
.done-actions { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }

#confetti { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 20; }
.noscript { padding: 20px; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}

</style>
</head>
<body>
<div class="app">

  <!-- Startseite: Rechenart wählen -->
  <section id="screen-home" class="screen" aria-labelledby="home-title">
    <header class="hero">
      <div class="hero-text">
        <p class="eyebrow">Grundrechenarten · 5. Klasse</p>
        <h1 id="home-title">Rechen-Gipfel</h1>
        <p class="lead">Wähle einen Berg und steig von Hütte zu Hütte bis zum Gipfel. Mit jeder geschafften Runde werden die Aufgaben schwerer.</p>
      </div>
      <div class="hero-side">
        <div class="mascot" id="home-mascot" aria-hidden="true"></div>
        <div class="score-pill" id="home-points" aria-live="polite">0 Punkte</div>
      </div>
    </header>
    <h2 class="pick-title">1. Was möchtest du üben?</h2>
    <div class="op-grid" id="op-grid"></div>
    <footer class="home-foot">
      <button type="button" class="link-btn" id="reset-btn">Fortschritt löschen</button>
      <div id="reset-confirm" class="reset-confirm" hidden>
        <span>Wirklich alle Hütten und Punkte löschen?</span>
        <button type="button" class="btn small danger" id="reset-yes">Ja, löschen</button>
        <button type="button" class="btn small ghost" id="reset-no">Abbrechen</button>
      </div>
    </footer>
  </section>

  <!-- Verfahren wählen -->
  <section id="screen-mode" class="screen" hidden aria-labelledby="mode-title">
    <nav class="crumbs"><button type="button" class="back-btn" data-go="home">← Zurück</button><span id="mode-crumb"></span></nav>
    <h2 class="pick-title" id="mode-title">2. Wie möchtest du rechnen?</h2>
    <div class="choice-grid" id="mode-grid"></div>
  </section>

  <!-- Stufe wählen -->
  <section id="screen-stufe" class="screen" hidden aria-labelledby="stufe-title">
    <nav class="crumbs"><button type="button" class="back-btn" data-go="mode">← Zurück</button><span id="stufe-crumb"></span></nav>
    <h2 class="pick-title" id="stufe-title">3. Welche Stufe?</h2>
    <div class="choice-grid" id="stufe-grid"></div>
  </section>

  <!-- Üben -->
  <section id="screen-play" class="screen" hidden aria-labelledby="play-title">
    <div class="play-bar">
      <button type="button" class="back-btn" id="play-back">← Stufen</button>
      <div class="play-info">
        <span class="badge" id="play-path"></span>
        <span class="badge soft" id="play-level"></span>
      </div>
      <div class="play-score" id="play-points" aria-live="polite"></div>
    </div>
    <div class="dots" id="play-dots" aria-label="Fortschritt in dieser Runde"></div>

    <div class="play-main">
      <div class="task-card">
        <p class="task-kicker" id="play-kicker"></p>
        <h2 class="task-title" id="play-title"></h2>
        <div id="sach-box" class="sach" hidden></div>
        <div id="work" class="work"></div>
        <div id="answer-box" class="answer-box" hidden></div>
      </div>

      <aside class="side">
        <div class="coach">
          <div class="mascot small" id="play-mascot" aria-hidden="true"></div>
          <div class="bubble" id="bubble" aria-live="polite"></div>
        </div>
        <div class="pad" id="pad" aria-label="Zahlenfeld"></div>
        <div class="actions">
          <button type="button" class="btn ghost" id="hint-btn">Tipp</button>
          <button type="button" class="btn primary" id="check-btn">Prüfen</button>
        </div>
      </aside>
    </div>
  </section>

  <!-- Rundenende -->
  <section id="screen-done" class="screen" hidden aria-labelledby="done-title">
    <div class="done-card">
      <div class="mascot big" id="done-mascot" aria-hidden="true"></div>
      <h2 id="done-title"></h2>
      <div class="done-stars" id="done-stars"></div>
      <p id="done-text" class="lead"></p>
      <div class="done-trail" id="done-trail"></div>
      <div class="done-actions">
        <button type="button" class="btn primary" id="again-btn">Nächste Runde</button>
        <button type="button" class="btn ghost" id="to-stufe-btn">Andere Stufe</button>
        <button type="button" class="btn ghost" id="to-home-btn">Andere Rechenart</button>
      </div>
    </div>
  </section>

</div>
<canvas id="confetti" aria-hidden="true"></canvas>
<noscript><p class="noscript">Bitte JavaScript einschalten, damit die Lernwelt funktioniert.</p></noscript>
<script>
/* Rechen-Gipfel – kleine Hilfsfunktionen */
window.RG = window.RG || {};
(function (RG) {
  RG.rnd = function (a, b) { return a + Math.floor(Math.random() * (b - a + 1)); };
  RG.pick = function (arr) { return arr[Math.floor(Math.random() * arr.length)]; };
  RG.shuffle = function (arr) {
    var a = arr.slice();
    for (var i = a.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));

<script>

  RG.title = function (t) {

  /* Schritte für „Zahl mal einstellige Zahl“ wie auf dem Plakat */
  function mulSteps(n, f) {
    var ds = String(n).split('').reverse().map(Number), c = 0, out = [];
    ds.forEach(function (x, i) {
      var pr = f * x, tot = pr + c, last = i === ds.length - 1;
      var s = f + ' mal ' + x + ' ist ' + pr + (c ? ', plus ' + c + ' gemerkt ist ' + tot : '');

      out.push(s);

  }
  /* Überträge beim Malnehmen: {stelle: übertrag} */
  function mulCarries(n, f) {
    var ds = String(n).split('').reverse().map(Number), c = 0, res = {};

  function addCarries(nums) {
    var L = Math.max.apply(null, nums.map(len)), c = 0, res = {};
    for (var i = 0; i < L; i++) {
      var s = c;
      nums.forEach(function (n) { s += Math.floor(n / Math.pow(10, i)) % 10; });
      c = Math.floor(s / 10);

  }

    if (t.kind === 'mul') { var n = RG.roundLead(t.n), f = t.f < 10 ? t.f : RG.roundLead(t.f); return F(n) + ' · ' + f + ' = ' + F(n * f); }

  RG.overschlag = overschlag;

  /* =================== Schriftlich: Rechenkästchen =================== */
  RG.buildGrid = function (t, stufe) {
    var spec;
    if (t.kind === 'add') spec = gridAdd(t);
    else if (t.kind === 'sub') spec = gridSub(t);

    return spec;
  };

  function gridAdd(t) {
    var W = Math.max(len(t.answer), Math.max.apply(null, t.terms.map(len)));
    var cols = range(1, W), rows = [];
    t.terms.forEach(function (x, j) {
      rows.push({ type: 'static', cells: alignRight(x, cols), sign: j === t.terms.length - 1 ? '+' : '' });
    });
    rows.push({ type: 'helper', key: 'c', cols: cols, mode: 'digit', small: true, label: 'Merkzahl' });
    rows.push({ type: 'input', key: 'res', cols: cols, ruleTop: true, label: 'Summe' });
    var carry = addCarries(t.terms), solC = {};

    var steps = [], c = 0;
    for (var i = 0; i < len(t.answer); i++) {

      },
      solution: { res: alignRight(t.answer, cols), c: solC },
      hint: 'Schreib Stelle unter Stelle und beginne rechts bei den Einern. ' + steps[0] + '. Überschlag: ' + overschlag(t),

  /* Bayerisches Verfahren: Abziehen mit Entbündeln, Strich unter der entbündelten Stelle */
  RG.subBavaria = function (a, b) {

      var y = B[i] || 0;

        if (avail[i] > 0) steps.push(taken[i] && !chain[i] ? A[i] + ' ' + P[i] + ' − | = ' + avail[i] + ' ' + P[i] + ', übernehmen' : avail[i] + ' ' + P[i] + ' übernehmen');
        continue;
      }
      var label = chain[i] ? '9 ' + P[i] + ' (nach dem Entbündeln)' : (taken[i] ? A[i] + ' ' + P[i] + ' − |' : avail[i] + ' ' + P[i]);
      if (avail[i] < y) {
        var j = i + 1;
        while (avail[j] === 0) j++;
        avail[j] -= 1; taken[j] = true;
        for (var k = j - 1; k > i; k--) { avail[k] = 9; chain[k] = true; taken[k] = true; }
        avail[i] += 10;
        var txt = label + ' − ' + y + ' ' + P[i] + ' geht nicht. Ich entbündele 1 ' + P[j] + ' (|)';
        if (j > i + 1) txt += ' und tausche weiter, bis ich 10 ' + P[i] + ' mehr habe';
        txt += '. ' + avail[i] + ' ' + P[i] + ' − ' + y + ' ' + P[i] + ' = ' + (avail[i] - y) + ' ' + P[i];
        steps.push(txt);

  };

  function gridSub(t) {
    var W = len(t.a), cols = range(1, W);
    var bav = RG.subBavaria(t.a, t.b), marks = {};
    bav.marks.forEach(function (p) { marks[W - p] = '|'; });
    var rows = [
      { type: 'static', cells: alignRight(t.a, cols) },
      { type: 'helper', key: 'm', cols: cols, mode: 'mark', small: true, label: 'Entbündel-Strich' },
      { type: 'static', cells: alignRight(t.b, cols), sign: '−' },
      { type: 'input', key: 'res', cols: cols, ruleTop: true, label: 'Differenz' }
    ];
    return {
      C: W, rows: rows,
      check: function (read) {
        var r = read('res'), ok = r === t.answer;
        return { ok: ok, rows: { res: ok }, msg: ok ? '' : 'Die Differenz stimmt noch nicht. Wenn oben zu wenig ist: entbündeln und einen Strich machen.' };
      },
      solution: { res: alignRight(t.answer, cols), m: marks },
      hint: 'Beginne rechts bei den Einern. ' + bav.steps[0] + '. Tipp: Tippe in die Strich-Zeile, wenn du entbündelst.',
      steps: bav.steps
    };
  }

  function gridMul1(t) {
    var Ln = len(t.n), W = Ln + 2, cells = alignRight(t.n, range(1, Ln));
    cells[Ln + 1] = '·'; cells[Ln + 2] = String(t.f);
    var resCols = range(W - Ln, W);
    var carry = mulCarries(t.n, t.f), solC = {};
    Object.keys(carry).forEach(function (p) { solC[W - Number(p)] = String(carry[p]); });

      { type: 'static', cells: cells },
      { type: 'helper', key: 'c', cols: range(1, W), mode: 'digit', small: true, ruleTop: true, label: 'Merkzahl' },
      { type: 'input', key: 'res', cols: resCols, label: 'Ergebnis' }

    return {
      C: W, rows: rows,
      check: function (read) {
        var r = read('res'), ok = r === t.answer;
        return { ok: ok, rows: { res: ok }, msg: ok ? '' : 'Das Ergebnis stimmt noch nicht. Rechne von rechts nach links und addiere die Merkzahl.' };
      },
      solution: { res: alignRight(t.answer, resCols), c: solC },
      hint: 'Beginne ganz rechts: ' + mulSteps(t.n, t.f)[0] + '. Überschlag: ' + overschlag(t),
      steps: steps
    };
  }

  function gridMul2(t) {
    var Ln = len(t.n), W = Ln + 3, T = Math.floor(t.f / 10), E = t.f % 10;
    var cells = alignRight(t.n, range(1, Ln));
    cells[Ln + 1] = '·'; cells[Ln + 2] = String(T); cells[Ln + 3] = String(E);

    var A = t.n * T * 10, B = t.n * E;
    var carry = addCarries([A, B]), solC = {};
    Object.keys(carry).forEach(function (p) { solC[W - Number(p)] = String(carry[p]); });
    var rows = [
      { type: 'static', cells: cells },
      { type: 'input', key: 'r1', cols: wide, ruleTop: true, label: '1. Zwischenergebnis' },
      { type: 'input', key: 'r2', cols: narrow, label: '2. Zwischenergebnis' },
      { type: 'helper', key: 'c', cols: range(1, W), mode: 'digit', small: true, sign: '+', label: 'Merkzahl' },
      { type: 'input', key: 'res', cols: wide, ruleTop: true, label: 'Ergebnis' }
    ];
    var steps = ['Erst mit der ' + T + '0: 0 nach unten, dann ' + T + ' mal …'].concat(mulSteps(t.n, T).map(function (s) { return '   ' + s; }))
      .concat(['Dann mit der ' + E + ':']).concat(E ? mulSteps(t.n, E).map(function (s) { return '   ' + s; }) : ['   ' + E + ' mal ' + F(t.n) + ' ist 0'])
      .concat(['Zum Schluss die Zwischenergebnisse addieren: ' + F(A) + ' + ' + F(B) + ' = ' + F(t.answer)]);
    return {
      C: W, rows: rows,
      check: function (read) {
        var v1 = read('r1'), v2 = read('r2'), r = read('res');
        var a = v1 === null ? -1 : v1, b = v2 === null ? 0 : v2;
        var ok1 = a === A || a === B;
        var ok2 = a === A ? b === B : (a === B ? b === A : (b === A || b === B));
        if (v1 === null && v2 === null) { ok1 = false; ok2 = false; }
        var ok3 = r === t.answer, msg = '';
        if (!(ok1 && ok2) && ok3) msg = 'Das Ergebnis stimmt. Schreib aber auch die Zwischenergebnisse richtig hin.';
        else if (ok1 && ok2 && !ok3) msg = 'Die Zwischenergebnisse stimmen. Rechne die Addition unten nochmal nach.';
        else if (!(ok1 && ok2 && ok3)) msg = 'Die rot markierten Zeilen stimmen noch nicht. Erst mit der ' + T + '0, dann mit der ' + E + '.';
        return { ok: ok1 && ok2 && ok3, rows: { r1: ok1, r2: ok2, res: ok3 }, msg: msg };
      },
      solution: { r1: alignRight(A, wide), r2: alignRight(B, narrow), res: alignRight(t.answer, wide), c: solC },
      hint: 'Erst mit der ' + T + '0: Schreib rechts eine 0 und rechne dann ' + T + ' mal ' + F(t.n) + '. Danach mit der ' + E + '. Überschlag: ' + overschlag(t),

      .concat([parts.map(function (p) { return F(p * fixed); }).join(' + ') + ' = ' + F(t.answer)]);

      rows: rows, slots: slots, solution: sol, steps: steps,
      hint: given
        ? 'Rechne jede Zeile mit dem Einmaleins: ' + steps[0] + '. Zum Schluss addierst du alles.'
        : 'Zerlege ' + F(whole) + ' in ' + parts.map(F).join(' + ') + '. Nimm jeden Teil mal ' + F(fixed) + ' und addiere am Ende.',
      check: function (read) {
        var bad = [], sum = 0, msg = '';
        parts.forEach(function (_, i) {

        }
        if (read('res') !== t.answer) bad.push('res');

  function stepsDiv(t, stufe) {

    for (var i = 0; i < k; i++) {

      slots.push({ id: 'p' + i, w: wP, given: given ? qp[i] * t.d : null });
      slots.push({ id: 'q' + i, w: wQ });

      for (var j = 0; j < k; j++) { if (j) sumRow.push(x('+')); sumRow.push(ref('q' + j)); }

    }

    var steps = qp.map(function (q) { return F(q * t.d) + ' : ' + F(t.d) + ' = ' + F(q); })
      .concat([qp.map(F).join(' + ') + ' = ' + F(t.q)]);
    return {
      rows: rows, slots: slots, solution: sol, steps: steps,
      hint: given
        ? 'Teile jede Zeile einzeln: ' + steps[0] + '. Danach addierst du die Ergebnisse.'
        : 'Zerlege ' + F(t.D) + ' in Zahlen, die sich gut durch ' + F(t.d) + ' teilen lassen, zum Beispiel ' + F(qp[0] * t.d) + '.',
      check: function (read) {
        var bad = [], sum = 0, used = 0, msg = '';
        for (var i = 0; i < k; i++) {

          used++;
          if (p === null || p % t.d !== 0) {
            bad.push('p' + i);
            if (p !== null && !msg) msg = F(p) + ' lässt sich nicht ohne Rest durch ' + F(t.d) + ' teilen.';
          }
          if (q === null || p === null || q * t.d !== p) bad.push('q' + i);
          sum += p || 0;
        }
        if (!given && used < 2) { msg = 'Zerlege ' + F(t.D) + ' in mindestens zwei Teile.'; bad.push('p0', 'p1'); }
        else if (!given && sum !== t.D) {
          for (var j = 0; j < k; j++) if (read('p' + j) !== null && bad.indexOf('p' + j) < 0) bad.push('p' + j);
          msg = 'Deine Teile ergeben zusammen ' + F(sum) + ', nicht ' + F(t.D) + '.';
        }
        if (read('res') !== t.q) bad.push('res');
        if (bad.length && !msg) msg = 'Die rot markierten Felder stimmen noch nicht.';
